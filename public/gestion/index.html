<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Sistema de Gestión Quio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand brand-logo" href="#dashboard" aria-label="Quio, inicio"><span class="logo-crop"><img src="assets/images/logo-quio.png" alt="Quio"></span></a>
      <nav id="nav" aria-label="Navegación principal">
        <a href="#dashboard" data-route="dashboard"><span aria-hidden="true">⌂</span>Resumen</a>
        <a href="#clients" data-route="clients"><span aria-hidden="true">♙</span>Clientes</a>
        <a href="#reviews" data-route="reviews"><span aria-hidden="true">✓</span>Revisiones Quio</a>
        <a href="#quotes" data-route="quotes"><span aria-hidden="true">◇</span>Cotizaciones</a>
        <a href="#projects" data-route="projects"><span aria-hidden="true">□</span>Proyectos</a>
        <a href="#finance" data-route="finance"><span aria-hidden="true">$</span>Finanzas</a>
        <a href="#settings" data-route="settings"><span aria-hidden="true">⚙</span>Configuración</a>
      </nav>
      <div class="sidebar-foot" id="syncStatus"><span class="status-dot"></span> Datos en este dispositivo</div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
        <div><p id="eyebrow">OPERACIÓN QUIO</p><h1 id="pageTitle">Resumen</h1></div>
        <div class="top-actions">
          <label class="global-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="Buscar en Quio…" aria-label="Buscar en todo el sistema"></label>
        </div>
      </header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="recordDialog">
    <form method="dialog" class="dialog-card" id="recordForm">
      <div class="dialog-head"><div><p class="eyebrow" id="dialogEyebrow">NUEVO REGISTRO</p><h2 id="dialogTitle">Crear</h2></div><button class="icon-btn" value="cancel" formnovalidate aria-label="Cerrar">×</button></div>
      <div id="dialogBody"></div>
      <div class="dialog-actions"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" value="default" id="dialogSave">Guardar</button></div>
    </form>
  </dialog>
  <dialog id="confirmDialog">
    <form method="dialog" class="dialog-card compact">
      <h2 id="confirmTitle">Confirmar acción</h2><p id="confirmText"></p>
      <div class="dialog-actions"><button class="btn" value="cancel">Cancelar</button><button class="btn danger" value="confirm">Confirmar</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="fileInput" type="file" accept=".json,application/json" hidden>
  <script src="js/supabase-config.js"></script>
  <script src="js/core.js?v=20260730-3"></script>
  <script src="js/documents.js?v=20260730-3"></script>
  <script src="js/operations.js?v=20260730-3"></script>
  <script src="js/app.js?v=20260730-3"></script>
  <script src="js/sync.js?v=20260730-3"></script>
</body>
</html>
